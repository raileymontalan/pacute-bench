[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacute-bench"
version = "0.1.0"
description = "Diagnostic benchmark for Filipino morphological and phonological understanding in LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jann Railey Montalan", email = "railey@aisingapore.org" },
    { name = "David Demitri Africa" },
    { name = "Jimson Paulo Layacan" },
    { name = "Richell Isaiah Flores" },
    { name = "Ivan Yuri De Leon" },
    { name = "Lance Calvin Gamboa" },
]
keywords = ["NLP", "Filipino", "morphology", "benchmark", "evaluation", "LLM"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/raileymontalan/pacute-bench"
Repository = "https://github.com/raileymontalan/pacute-bench"
Paper = "https://arxiv.org/abs/2506.XXXXX"
dependencies = [
    "vllm==0.20.2",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.5.4",
    "mistral-common>=1.11.0",
    "openai>=1.30",
    "anthropic>=0.40",
    "google-genai>=0.8",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-Levenshtein>=0.25",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pacute-generate = "pacute_bench.scripts.generate_benchmarks:main"
pacute-eval = "pacute_bench.scripts.run_evaluation:main"
